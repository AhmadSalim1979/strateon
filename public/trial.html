<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Trial — Qiyadon</title>
  <meta name="description" content="Start your 14-day free Qiyadon trial. No credit card, no discovery call. 25 leads to prove the concept.">
  <meta http-equiv="refresh" content="0;url=/sign-trial.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #F5F7FA;
    }
    .redirect-box {
      text-align: center; padding: 48px;
      background: white; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(11,31,58,0.10);
      max-width: 480px; margin: 24px;
    }
    .redirect-box h1 { font-size: 24px; color: #0B1F3A; margin-bottom: 12px; }
    .redirect-box p { color: #6B7C93; font-size: 16px; margin-bottom: 24px; }
    .redirect-box a {
      display: inline-block; background: #F5A623; color: white;
      font-weight: 600; font-size: 15px; padding: 14px 32px;
      border-radius: 10px; text-decoration: none;
      transition: background 0.2s;
    }
    .redirect-box a:hover { background: #e09620; text-decoration: none; }
  </style>
</head>
<body>
  <div class="redirect-box">
    <h1>Redirecting to your free trial…</h1>
    <p>If you're not redirected automatically, click below.</p>
    <a href="/sign-trial.html">Start Your Free Trial →</a>
  </div>
  <script>window.location = '/sign-trial.html';</script>
</body>
</html>
