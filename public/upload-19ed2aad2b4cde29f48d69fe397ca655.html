<!doctype html>
<html><head><meta charset="utf-8"><title>Upload images</title>
<style>body{font-family:sans-serif;max-width:520px;margin:60px auto;padding:0 20px;}
input,button{font-size:16px;padding:10px;margin-top:10px;width:100%;box-sizing:border-box;}
button{background:#10B981;color:#fff;border:none;border-radius:6px;cursor:pointer;}
ul{list-style:none;padding:0;margin-top:14px;font-size:14px;}
li{padding:6px 0;border-bottom:1px solid #eee;}
.ok{color:#10B981;} .err{color:#B42318;}</style></head>
<body>
<h2>Upload images to Claude</h2>
<p>Select one or more files, then click Upload. Each file is sent one at a time.</p>
<input type="file" id="f" accept="image/png,image/jpeg" multiple>
<button id="btn">Upload all</button>
<ul id="list"></ul>
<script>
document.getElementById('btn').onclick = function () {
  var input = document.getElementById('f');
  var list = document.getElementById('list');
  var files = Array.prototype.slice.call(input.files);
  if (!files.length) { alert('Choose at least one file first.'); return; }
  list.innerHTML = '';
  files.forEach(function (file) {
    var li = document.createElement('li');
    li.textContent = file.name + ': uploading...';
    list.appendChild(li);
    var reader = new FileReader();
    reader.onload = function () {
      fetch('https://api.qiyadon.com/tmp-upload-19ed2aad2b4cde29f48d69fe397ca655', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: file.name, data_base64: reader.result })
      }).then(function (r) { return r.json(); }).then(function (body) {
        li.textContent = file.name + ': ' + (body.success ? 'Done' : 'Error: ' + body.error);
        li.className = body.success ? 'ok' : 'err';
      }).catch(function () {
        li.textContent = file.name + ': upload failed';
        li.className = 'err';
      });
    };
    reader.readAsDataURL(file);
  });
};
</script>
</body></html>
