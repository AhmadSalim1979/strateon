<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qiyadon Logo</title>
</head>
<body style="margin:0;padding:40px;background:#F5F7FA;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">

  <!-- Logo Option 1: Horizontal Wordmark -->
  <div id="logo-horizontal" style="text-align:center;padding:20px 0;">
    <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:42px;font-weight:800;letter-spacing:-1px;color:#0B1F3A;">
      Strat<span style="color:#00C2CB;">eon</span>
    </span>
  </div>

  <br><br>

  <!-- Logo Option 2: With Icon Mark -->
  <div style="text-align:center;padding:20px 0;">
    <table cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
      <tr>
        <!-- Icon mark: stylized "S" arrow motif using shapes -->
        <td style="vertical-align:middle;padding-right:12px;">
          <!-- Stylized mark: stacked chevron-ish shapes -->
          <table cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td style="width:20px;height:20px;background:#F5A623;border-radius:3px;"></td>
            </tr>
            <tr>
              <td style="width:16px;height:16px;background:#00C2CB;border-radius:3px;margin-top:2px;"></td>
            </tr>
            <tr>
              <td style="width:12px;height:12px;background:#0B1F3A;border-radius:3px;margin-top:2px;"></td>
            </tr>
          </table>
        </td>
        <td style="vertical-align:middle;">
          <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:42px;font-weight:800;letter-spacing:-1px;color:#0B1F3A;">
            Strat<span style="color:#00C2CB;">eon</span>
          </span>
        </td>
      </tr>
    </table>
  </div>

  <br><br>

  <!-- Logo Option 3: Minimal text only -->
  <div style="text-align:center;padding:20px 0;">
    <table cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
      <tr>
        <!-- Accent dot -->
        <td style="vertical-align:middle;padding-right:10px;font-size:28px;color:#00C2CB;">●</td>
        <td style="vertical-align:middle;">
          <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:38px;font-weight:700;letter-spacing:-0.5px;color:#0B1F3A;">
            STRATEON
          </span>
        </td>
      </tr>
    </table>
  </div>

  <br><br>

  <!-- Logo Option 4: Gold underline accent -->
  <div style="text-align:center;padding:20px 0;">
    <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:46px;font-weight:800;letter-spacing:-1px;color:#0B1F3A;display:inline-block;position:relative;">
      Qiyadon
      <span style="display:block;width:60%;;height:4px;background:#F5A623;margin:6px auto 0;border-radius:2px;"></span>
    </span>
  </div>

  <br><br>

  <!-- Recommended: Clean wordmark with teal accent -->
  <div style="text-align:center;padding:20px 0;background:#ffffff; border-radius:12px; display:inline-block; width:100%;">
    <h2 style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:48px;font-weight:800;letter-spacing:-1.5px;color:#0B1F3A;margin:0 0 8px 0;">
      Strat<span style="color:#00C2CB;">eon</span>
    </h2>
    <div style="width:60px;height:3px;background:#F5A623;margin:0 auto;border-radius:2px;"></div>
  </div>

</body>
</html>
